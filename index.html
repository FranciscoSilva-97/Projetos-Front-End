<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelReserve Pro | Sistema Completo de Reservas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Reset e configurações básicas */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #8b5cf6;
            --secondary-dark: #7c3aed;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --warning-dark: #d97706;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --radius-2xl: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--gray-800);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-xl);
            padding: 1.5rem 2rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .user-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
        }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            background: white;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--gray-100);
            padding: 0.375rem 0.75rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .card-rating i {
            color: #fbbf24;
        }

        .card-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-600);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .card-description {
            color: var(--gray-600);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-600);
            font-size: 0.8125rem;
        }

        .detail-item i {
            color: var(--primary);
            width: 1rem;
            flex-shrink: 0;
        }

        .card-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1.25rem;
            border-top: 1px solid var(--gray-200);
        }

        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .price span {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 400;
        }

        /* Flight cards */
        .flight-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .flight-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .airline {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .airline-logo {
            width: 3rem;
            height: 3rem;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .airline-name {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .flight-class {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .flight-route {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .route-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .route-city {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-top: 0.25rem;
        }

        .route-duration {
            text-align: center;
            color: var(--gray-700);
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .flight-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.875rem;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            white-space: nowrap;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
            box-shadow: var(--shadow-sm);
        }

        .btn-outline {
            background: transparent;
            color: var(--gray-700);
            border: 2px solid var(--gray-200);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-icon {
            padding: 0.5rem;
            width: 2.5rem;
            height: 2.5rem;
        }

        .btn-favorite {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: var(--transition);
            color: var(--gray-400);
        }

        .btn-favorite:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .btn-favorite.active {
            color: var(--danger);
        }

        .btn-back {
            background: white;
            color: var(--gray-700);
            border: 2px solid var(--gray-200);
            margin-bottom: 2rem;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: var(--radius-xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--gray-500);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
        }

        .modal-close:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 400px;
            width: 100%;
        }

        .toast {
            background: white;
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: currentColor;
            opacity: 0.2;
        }

        .toast-success {
            border-left-color: var(--success);
            color: var(--success);
        }

        .toast-error {
            border-left-color: var(--danger);
            color: var(--danger);
        }

        .toast-info {
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .toast-warning {
            border-left-color: var(--warning);
            color: var(--warning);
        }

        .toast-content {
            flex-grow: 1;
        }

        .toast-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: 0.7;
            transition: var(--transition);
            padding: 0.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
        }

        .toast-close:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.05);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-600);
        }

        .loading-spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hero section */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
            padding: 2rem;
            border-radius: var(--radius-xl);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-top: 1rem;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Section headers */
        .section-header {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .view-all {
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.9;
            transition: var(--transition);
        }

        .view-all:hover {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Empty states */
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .empty-state-icon {
            font-size: 3rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }

        /* Auth Pages */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(139, 92, 246, 0.8));
        }

        .auth-card {
            background: white;
            border-radius: var(--radius-2xl);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-xl);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .auth-logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 3.5rem;
            height: 3.5rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .auth-logo-text {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .auth-form {
            margin-bottom: 2rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--gray-200);
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--gray-400);
        }

        .auth-divider:before,
        .auth-divider:after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .auth-divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            background: white;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .social-btn.google {
            color: #EA4335;
        }

        .social-btn.facebook {
            color: #1877F2;
        }

        .social-btn.apple {
            color: #000000;
        }

        .social-btn.microsoft {
            color: #0078D4;
        }

        /* User Dashboard */
        .user-dashboard {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .user-welcome h1 {
            font-size: 1.75rem;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .user-welcome p {
            color: var(--gray-600);
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .dashboard-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .dashboard-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-list {
            list-style: none;
        }

        .section-list li {

            }
            
            .toast-container {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
            }
            
            .auth-card {
                padding: 2rem;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
            
            .dashboard-stats {
                grid-template-columns: 1fr;
            }
        }

        /* Formulários */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: var(--transition);
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input.error {
            border-color: var(--danger);
        }

        .form-error {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Seat Selection */
        .seat-selection-container {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: var(--shadow-lg);
        }

        .seat-selection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .seat-selection-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .seat-legend {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .legend-color {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 4px;
        }

        .legend-available {
            background: var(--success);
        }

        .legend-selected {
            background: var(--primary);
        }

        .legend-occupied {
            background: var(--gray-300);
        }

        .seats-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.5rem;
            margin: 2rem 0;
        }

        .seat {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .seat:hover:not(.occupied) {
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }

        .seat.available {
            background: var(--success);
        }

        .seat.selected {
            background: var(--primary);
            border-color: var(--primary-dark);
        }

        .seat.occupied {
            background: var(--gray-300);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Payment Methods */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .payment-method {
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .payment-method:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .payment-method.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));

            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .payment-name {

            color: var(--gray-800);
            margin-bottom: 0.5rem;

        .payment-desc {
            font-size: 0.75rem;
            color: var(--gray-600);

        }

        .passenger-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;

            height: 3rem;

            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gray-600);
            transition: var(--transition);

            transform: scale(1.1);

        .step-label {
            font-size: 0.875rem;
            color: var(--gray-600);
            font-weight: 600;
        }

        .progress-step.active .step-label {
            color: var(--primary);
        }

        .progress-line {
            position: absolute;
            top: 1.5rem;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gray-200);
            z-index: 0;
        }

        .progress-line-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .aircraft-card {
            background: white;
            border-radius: var(--radius-lg);

            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .aircraft-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

            width: 3rem;
            height: 3rem;

            font-size: 1.125rem;
        }

        .aircraft-type {

            color: var(--gray-600);
            margin-top: 0.25rem;

            gap: 0.75rem;
            margin-top: 1rem;
        }

            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray-700);
        }

        .aircraft-detail i {
            color: var(--primary);

        }

            margin: 1rem 0;
            flex-wrap: wrap;
        }

            color: var(--gray-600);
            margin-top: 0.25rem;

            font-weight: 600;

            color: var(--gray-600);
        }

        .summary-value {

            color: var(--gray-800);
        }

            border-radius: var(--radius-xl);
            padding: 3rem;
            margin: 2rem 0;
            text-align: center;
            box-shadow: var(--shadow-lg);

            color: var(--success);

            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-top: 2rem;
            text-align: left;
        }

        /* Filter bar */
        .filter-bar {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.875rem;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            background: white;
            font-size: 0.875rem;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease-out;
        }
    </style>

        // Componente Toast
        function Toast({ message, type, onClose }) {
            React.useEffect(() => {
                const timer = setTimeout(onClose, 5000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                info: 'fas fa-info-circle',
                warning: 'fas fa-exclamation-triangle'
            };

            return (
                <div className={`toast toast-${type}`} role="alert" aria-live="polite">
                    <i className={icons[type]} aria-hidden="true"></i>
                    <div className="toast-content">
                        <strong>{type === 'success' ? 'Sucesso' : type === 'error' ? 'Erro' : type === 'info' ? 'Informação' : 'Aviso'}: </strong>
                        <span>{message}</span>
                    </div>
                    <button 
                        className="toast-close" 
                        onClick={onClose}
                        aria-label="Fechar notificação"
                    >
                        <i className="fas fa-times" aria-hidden="true"></i>
                    </button>
                </div>
            );
        }

        // Componente Login
        function Login({ onLogin, onSwitchToRegister }) {
            const [formData, setFormData] = React.useState({
                email: '',
                password: '',
                rememberMe: false
            });
            
            const [errors, setErrors] = React.useState({});
            const [isLoading, setIsLoading] = React.useState(false);

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                if (errors[field]) {
                    setErrors(prev => ({ ...prev, [field]: '' }));
                }
            };

            const validateForm = () => {
                const newErrors = {};
                
                if (!formData.email.trim()) {
                    newErrors.email = 'E-mail é obrigatório';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'E-mail inválido';
                }
                
                if (!formData.password.trim()) {
                    newErrors.password = 'Senha é obrigatória';
                } else if (formData.password.length < 6) {
                    newErrors.password = 'Senha deve ter pelo menos 6 caracteres';
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!validateForm()) {
                    return;
                }
                
                setIsLoading(true);
                
                try {
                    // Simular chamada de API
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    const user = {
                        id: 1,
                        name: 'João Silva',
                        email: formData.email,

                            miles: 12500,
                            favorites: 5

                        preferences: {
                            newsletter: true,
                            notifications: true
                        }
                    };
                    
                    onLogin(user);
                    window.addToast?.('Login realizado com sucesso!', 'success');

                    window.addToast?.('Erro ao fazer login. Tente novamente.', 'error');

                                <label className="form-label">Senha</label>
                                <input

        // Componente Register

            });
            
            const [errors, setErrors] = React.useState({});
            const [isLoading, setIsLoading] = React.useState(false);

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                if (errors[field]) {
                    setErrors(prev => ({ ...prev, [field]: '' }));
                }
            };

            const validateForm = () => {
                const newErrors = {};
                
                if (!formData.name.trim()) {
                    newErrors.name = 'Nome completo é obrigatório';
                }
                
                if (!formData.email.trim()) {
                    newErrors.email = 'E-mail é obrigatório';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'E-mail inválido';
                }
                
                if (!formData.password.trim()) {
                    newErrors.password = 'Senha é obrigatória';
                } else if (formData.password.length < 8) {
                    newErrors.password = 'Senha deve ter pelo menos 8 caracteres';
                }
                
                if (!formData.confirmPassword.trim()) {
                    newErrors.confirmPassword = 'Confirme sua senha';
                } else if (formData.password !== formData.confirmPassword) {
                    newErrors.confirmPassword = 'As senhas não coincidem';
                }
                
                if (!formData.acceptTerms) {
                    newErrors.acceptTerms = 'Você deve aceitar os termos e condições';
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;

                if (!validateForm()) {

        // Componente ProgressBar
        function ProgressBar({ steps, currentStep }) {
            const progress = ((currentStep - 1) / (steps.length - 1)) * 100;

            return (
                <div className="progress-bar">
                    <div className="progress-line">
                        <div className="progress-line-fill" style={{ width: `${progress}%` }}></div>
                    </div>
                    {steps.map((step, index) => (
                        <div key={step.id} className={`progress-step ${index + 1 <= currentStep ? 'active' : ''}`}>
                            <div className="step-number">{index + 1}</div>
                            <div className="step-label">{step.label}</div>
                        </div>
                    ))}
                </div>
            );
        }

        // Componente Horários de Voo
        function FlightTimes({ flights, onSelectTime }) {
            const flightsByTime = flights.reduce((groups, flight) => {
                const time = flight.departure;
                const hour = parseInt(time.split(':')[0]);
                let timeGroup;
                
                if (hour >= 5 && hour < 12) timeGroup = 'Manhã';
                else if (hour >= 12 && hour < 18) timeGroup = 'Tarde';
                else if (hour >= 18 && hour < 22) timeGroup = 'Noite';
                else timeGroup = 'Madrugada';
                
                if (!groups[timeGroup]) groups[timeGroup] = [];
                groups[timeGroup].push(flight);
                return groups;
            }, {});

            return (
                <div style={{ marginBottom: '2rem' }}>
                    <h3 style={{ fontSize: '1.5rem', fontWeight: '600', color: 'white', marginBottom: '1rem' }}>
                        Horários de Partida
                    </h3>
                    <div className="flight-times">
                        {Object.entries(flightsByTime).map(([timeSlot, timeFlights]) => (
                            <div key={timeSlot} className="time-slot" onClick={() => onSelectTime(timeSlot)}>
                                <div className="time-display">{timeSlot}</div>
                                <div className="time-label">
                                    {timeFlights.length} voo{timeFlights.length !== 1 ? 's' : ''}
                                </div>
                                <div style={{ fontSize: '0.75rem', color: 'var(--gray-500)', marginTop: '0.5rem' }}>
                                    {timeFlights.map(f => f.departure).join(', ')}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Componente Dados do Passageiro
        function PassengerData({ onNext, onBack, flight }) {
            const [formData, setFormData] = React.useState({
                firstName: '',
                lastName: '',
                email: '',
                phone: '',
                document: '',
                birthDate: '',
                nationality: 'BR'
            });

            const [errors, setErrors] = React.useState({});

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                if (errors[field]) {
                    setErrors(prev => ({ ...prev, [field]: '' }));
                }
            };

            const validateForm = () => {
                const newErrors = {};
                
                if (!formData.firstName.trim()) newErrors.firstName = 'Nome é obrigatório';
                if (!formData.lastName.trim()) newErrors.lastName = 'Sobrenome é obrigatório';
                if (!formData.email.trim()) newErrors.email = 'E-mail é obrigatório';
                else if (!/\S+@\S+\.\S+/.test(formData.email)) newErrors.email = 'E-mail inválido';
                
                if (!formData.phone.trim()) newErrors.phone = 'Telefone é obrigatório';
                if (!formData.document.trim()) newErrors.document = 'Documento é obrigatório';
                if (!formData.birthDate) newErrors.birthDate = 'Data de nascimento é obrigatória';
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (validateForm()) {
                    onNext(formData);
                }
            };

            return (
                <div className="passenger-form-container">
                    <div className="passenger-header">
                        <h1 className="passenger-title">Dados do Passageiro</h1>
                        <p style={{ color: 'var(--gray-600)' }}>Preencha os dados para continuar com a reserva</p>
                    </div>
                    
                    <form onSubmit={handleSubmit}>
                        <div className="form-row">
                            <div className="form-group">
                                <label className="form-label">Nome *</label>
                                <input
                                    type="text"
                                    className={`form-input ${errors.firstName ? 'error' : ''}`}
                                    value={formData.firstName}
                                    onChange={(e) => handleChange('firstName', e.target.value)}
                                    placeholder="Digite seu nome"
                                />
                                {errors.firstName && <div className="form-error">{errors.firstName}</div>}
                            </div>
                            
                            <div className="form-group">
                                <label className="form-label">Sobrenome *</label>
                                <input
                                    type="text"
                                    className={`form-input ${errors.lastName ? 'error' : ''}`}
                                    value={formData.lastName}
                                    onChange={(e) => handleChange('lastName', e.target.value)}
                                    placeholder="Digite seu sobrenome"
                                />
                                {errors.lastName && <div className="form-error">{errors.lastName}</div>}
                            </div>
                        </div>
                        
                        <div className="form-row">
                            <div className="form-group">
                                <label className="form-label">E-mail *</label>
                                <input
                                    type="email"
                                    className={`form-input ${errors.email ? 'error' : ''}`}
                                    value={formData.email}
                                    onChange={(e) => handleChange('email', e.target.value)}
                                    placeholder="seu@email.com"
                                />
                                {errors.email && <div className="form-error">{errors.email}</div>}
                            </div>
                            
                            <div className="form-group">
                                <label className="form-label">Telefone *</label>
                                <input
                                    type="tel"
                                    className={`form-input ${errors.phone ? 'error' : ''}`}
                                    value={formData.phone}
                                    onChange={(e) => handleChange('phone', e.target.value)}
                                    placeholder="(11) 99999-9999"
                                />
                                {errors.phone && <div className="form-error">{errors.phone}</div>}
                            </div>
                        </div>
                        
                        <div className="form-row">
                            <div className="form-group">
                                <label className="form-label">CPF/Passaporte *</label>
                                <input
                                    type="text"
                                    className={`form-input ${errors.document ? 'error' : ''}`}
                                    value={formData.document}
                                    onChange={(e) => handleChange('document', e.target.value)}
                                    placeholder="000.000.000-00"
                                />
                                {errors.document && <div className="form-error">{errors.document}</div>}

                            <div className="form-group">
                                <label className="form-label">Data de Nascimento *</label>
                                <input
                                    type="date"
