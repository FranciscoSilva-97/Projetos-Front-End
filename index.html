        // Componente Seleção de Assentos
        function SeatSelection({ onNext, onBack, flight }) {
            const [selectedSeats, setSelectedSeats] = React.useState([]);
            
            // Gerar mapa de assentos
            const generateSeats = () => {
                const rows = 20;
                const seatsPerRow = 6;
                const seats = [];
                
                for (let row = 1; row <= rows; row++) {
                    for (let seatNum = 0; seatNum < seatsPerRow; seatNum++) {
                        const seatLetter = String.fromCharCode(65 + seatNum);
                        const seatId = `${row}${seatLetter}`;
                        const isOccupied = Math.random() > 0.7; // 30% ocupados
                        const seatType = seatTypes[Math.floor(Math.random() * seatTypes.length)];
                        
                        seats.push({
                            id: seatId,
                            row,
                            seat: seatLetter,
                            type: seatType.type,
                            typeName: seatType.name,
                            price: seatType.price,
                            occupied: isOccupied,
                            selected: false
                        });
                    }
                }
                return seats;
            };

            const [seats, setSeats] = React.useState(generateSeats());

            const handleSeatClick = (seatId) => {
                setSeats(prevSeats => 
                    prevSeats.map(seat => {
                        if (seat.id === seatId && !seat.occupied) {
                            const newSelected = !seat.selected;
                            if (newSelected && selectedSeats.length >= 6) {
                                window.addToast?.('Máximo de 6 assentos por reserva', 'warning');
                                return seat;
                            }
                            
                            // Atualizar lista de selecionados
                            if (newSelected) {
                                setSelectedSeats(prev => [...prev, { ...seat, selected: true }]);
                            } else {
                                setSelectedSeats(prev => prev.filter(s => s.id !== seatId));
                            }
                            
                            return { ...seat, selected: newSelected };
                        }
                        return seat;
                    })
                );
            };

            const getSeatClass = (seat) => {
                if (seat.occupied) return 'seat occupied';
                if (seat.selected) return 'seat selected';
                return 'seat available';
            };

            const totalSeatPrice = selectedSeats.reduce((sum, seat) => sum + seat.price, 0);

            return (
                <div className="seat-selection-container">
                    <div className="seat-selection-header">
                        <div>
                            <h1 className="seat-selection-title">Seleção de Assentos</h1>
                            <p style={{ color: 'var(--gray-600)' }}>Escolha seus assentos no {flight.aircraft}</p>
                        </div>
                        
                        <div className="seat-legend">
                            <div className="legend-item">
                                <div className="legend-color legend-available"></div>
                                <span>Disponível</span>
                            </div>
                            <div className="legend-item">
                                <div className="legend-color legend-selected"></div>
                                <span>Selecionado</span>
                            </div>
                            <div className="legend-item">
                                <div className="legend-color legend-occupied"></div>
                                <span>Ocupado</span>
                            </div>
                        </div>
                    </div>
                    
                    <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                        <div style={{ 
                            background: 'var(--gray-100)', 
                            padding: '1rem', 
                            borderRadius: 'var(--radius)',
                            display: 'inline-block'
                        }}>
                            <i className="fas fa-info-circle" style={{ marginRight: '0.5rem', color: 'var(--primary)' }} aria-hidden="true"></i>
                            Clique nos assentos disponíveis para selecionar
                        </div>
                    </div>
                    
                    <div className="seats-grid">
                        {seats.map(seat => (
                            <div
                                key={seat.id}
                                className={getSeatClass(seat)}
                                onClick={() => handleSeatClick(seat.id)}
                                title={`Assento ${seat.id} - ${seat.typeName} - R$ ${seat.price}`}
                            >
                                {seat.seat}
                            </div>
                        ))}
                    </div>
                    
                    {selectedSeats.length > 0 && (
                        <div className="booking-summary">
                            <h3 className="summary-title">Assentos Selecionados</h3>
                            {selectedSeats.map(seat => (
                                <div key={seat.id} className="summary-item">
                                    <div className="summary-label">
                                        Assento {seat.id} - {seat.typeName}
                                    </div>
                                    <div className="summary-value">
                                        R$ {seat.price.toLocaleString()}
                                    </div>
                                </div>
                            ))}
                            <div className="summary-item">
                                <div className="summary-label">Total Assentos</div>
                                <div className="summary-value">R$ {totalSeatPrice.toLocaleString()}</div>
                            </div>
                        </div>
                    )}
                    
                    <div style={{ display: 'flex', gap: '1rem', marginTop: '2rem' }}>
                        <button className="btn btn-outline" onClick={onBack}>
                            <i className="fas fa-arrow-left" aria-hidden="true"></i>
                            Voltar
                        </button>
                        <button 
                            className="btn btn-primary" 
                            onClick={() => onNext({ seats: selectedSeats, seatPrice: totalSeatPrice })}
                            disabled={selectedSeats.length === 0}
                        >
                            Continuar para Pagamento
                            <i className="fas fa-arrow-right" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            );
        }

        // Componente Pagamento
        function Payment({ onComplete, onBack, flight, passengerData, seatData }) {
            const [selectedPayment, setSelectedPayment] = React.useState(null);
            const [cardData, setCardData] = React.useState({
                number: '',
                name: '',
                expiry: '',
                cvv: ''
            });

            const totalPrice = flight.price + (seatData?.seatPrice || 0);

            const handlePaymentSelect = (methodId) => {
                setSelectedPayment(methodId);
            };

            const handleCardChange = (field, value) => {
                setCardData(prev => ({ ...prev, [field]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!selectedPayment) {
                    window.addToast?.('Selecione uma forma de pagamento', 'warning');
                    return;
                }
                
                const paymentInfo = {
                    method: paymentMethods.find(m => m.id === selectedPayment),
                    cardData: selectedPayment === 1 ? cardData : null,
                    total: totalPrice
                };
                
                onComplete(paymentInfo);
            };

            return (
                <div className="passenger-form-container">
                    <div className="passenger-header">
                        <h1 className="passenger-title">Pagamento</h1>
                        <p style={{ color: 'var(--gray-600)' }}>Escolha como deseja pagar sua viagem</p>
                    </div>
                    
                    <div className="booking-summary">
                        <h3 className="summary-title">Resumo da Reserva</h3>
                        <div className="summary-item">
                            <div className="summary-label">Voo {flight.airline} {flight.flightNumber}</div>
                            <div className="summary-value">R$ {flight.price.toLocaleString()}</div>
                        </div>
                        <div className="summary-item">
                            <div className="summary-label">Assentos ({seatData?.seats?.length || 0})</div>
                            <div className="summary-value">R$ {(seatData?.seatPrice || 0).toLocaleString()}</div>
                        </div>
                        <div className="summary-item">
                            <div className="summary-label">Taxas e Impostos</div>
                            <div className="summary-value">R$ {(totalPrice * 0.15).toLocaleString()}</div>
                        </div>
                        <div className="summary-item">
                            <div className="summary-label">Total</div>
                            <div className="summary-value" style={{ color: 'var(--primary)', fontSize: '1.25rem' }}>
                                R$ {(totalPrice * 1.15).toLocaleString()}
                            </div>
                        </div>
                    </div>
                    
                    <div style={{ margin: '2rem 0' }}>
                        <h3 style={{ fontSize: '1.25rem', fontWeight: '600', marginBottom: '1rem', color: 'var(--gray-800)' }}>
                            Formas de Pagamento
                        </h3>
                        
                        <div className="payment-methods">
                            {paymentMethods.map(method => (
                                <div
                                    key={method.id}
                                    className={`payment-method ${selectedPayment === method.id ? 'selected' : ''}`}
                                    onClick={() => handlePaymentSelect(method.id)}
                                >
                                    <div className="payment-icon">
                                        <i className={`fas ${method.icon}`} aria-hidden="true"></i>
                                    </div>
                                    <div className="payment-name">{method.name}</div>
                                    <div className="payment-desc">{method.description}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {selectedPayment === 1 && (
                        <div style={{ margin: '2rem 0' }}>
                            <h3 style={{ fontSize: '1.25rem', fontWeight: '600', marginBottom: '1rem', color: 'var(--gray-800)' }}>
                                Dados do Cartão
                            </h3>
                            
                            <form>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Número do Cartão</label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={cardData.number}
                                            onChange={(e) => handleCardChange('number', e.target.value)}
                                            placeholder="0000 0000 0000 0000"
                                        />
                                    </div>
                                </div>
                                
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Nome no Cartão</label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={cardData.name}
                                            onChange={(e) => handleCardChange('name', e.target.value)}
                                            placeholder="JOÃO S SILVA"
                                        />
                                    </div>
                                </div>
                                
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Validade</label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={cardData.expiry}
                                            onChange={(e) => handleCardChange('expiry', e.target.value)}
                                            placeholder="MM/AA"
                                        />
                                    </div>
                                    
                                    <div className="form-group">
                                        <label className="form-label">CVV</label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={cardData.cvv}
                                            onChange={(e) => handleCardChange('cvv', e.target.value)}
                                            placeholder="123"
                                        />
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}
                    
                    <div style={{ display: 'flex', gap: '1rem', marginTop: '2rem' }}>
                        <button className="btn btn-outline" onClick={onBack}>
                            <i className="fas fa-arrow-left" aria-hidden="true"></i>
                            Voltar
                        </button>
                        <button className="btn btn-primary" onClick={handleSubmit}>
                            <i className="fas fa-lock" aria-hidden="true"></i>
                            Confirmar Pagamento
                        </button>
                    </div>
                </div>
            );
        }

        // Componente Confirmação
        function Confirmation({ bookingData, onComplete }) {
            const [bookingCode, setBookingCode] = React.useState('');

            React.useEffect(() => {
                // Gerar código de reserva
                const code = 'TRV' + Math.random().toString(36).substr(2, 8).toUpperCase();
                setBookingCode(code);
                
                // Simular processamento
                setTimeout(() => {
                    onComplete();
                }, 3000);
            }, []);

            return (
                <div className="confirmation-container">
                    <div className="confirmation-icon">
                        <i className="fas fa-check-circle" aria-hidden="true"></i>
                    </div>
                    
                    <h1 className="confirmation-title">Reserva Confirmada!</h1>
                    
                    <div className="confirmation-message">
                        Sua reserva foi processada com sucesso. Os detalhes da sua viagem foram enviados para o e-mail {bookingData.passengerData.email}.
                    </div>
                    
                    <div className="booking-details">
                        <h3 style={{ fontSize: '1.25rem', fontWeight: '600', marginBottom: '1rem', color: 'var(--gray-800)' }}>
                            Detalhes da Reserva
                        </h3>
                        
                        <div className="summary-item">
                            <div className="summary-label">Código da Reserva</div>
                            <div className="summary-value">{bookingCode}</div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Voo</div>
                            <div className="summary-value">{bookingData.flight.airline} {bookingData.flight.flightNumber}</div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Rota</div>
                            <div className="summary-value">{bookingData.flight.fromCity} → {bookingData.flight.toCity}</div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Data e Hora</div>
                            <div className="summary-value">
                                {new Date(bookingData.flight.date).toLocaleDateString('pt-BR')} às {bookingData.flight.departure}
                            </div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Passageiro</div>
                            <div className="summary-value">{bookingData.passengerData.firstName} {bookingData.passengerData.lastName}</div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Assentos</div>
                            <div className="summary-value">
                                {bookingData.seatData.seats.map(s => s.id).join(', ')}
                            </div>
                        </div>
                        
                        <div className="summary-item">
                            <div className="summary-label">Total Pago</div>
                            <div className="summary-value" style={{ color: 'var(--primary)', fontSize: '1.25rem' }}>
                                R$ {((bookingData.flight.price + bookingData.seatData.seatPrice) * 1.15).toLocaleString()}
                            </div>
                        </div>
                    </div>
                    
                    <div style={{ marginTop: '2rem', display: 'flex', gap: '1rem', justifyContent: 'center' }}>
                        <button className="btn btn-primary" onClick={() => window.print()}>
                            <i className="fas fa-print" aria-hidden="true"></i>
                            Imprimir Voucher
                        </button>
                        <button className="btn btn-outline" onClick={() => window.location.reload()}>
                            <i className="fas fa-home" aria-hidden="true"></i>
                            Nova Reserva
                        </button>
                    </div>
                </div>
            );
        }

        // Componente Principal do App
        function App() {
            const [currentView, setCurrentView] = React.useState('home');
            const [authMode, setAuthMode] = React.useState('login');
            const [currentStep, setCurrentStep] = React.useState(1);
            const [user, setUser] = React.useState(null);
            const [toasts, setToasts] = React.useState([]);
            const [favorites, setFavorites] = React.useState([]);
            const [selectedDestination, setSelectedDestination] = React.useState(null);
            const [selectedFlight, setSelectedFlight] = React.useState(null);
            const [passengerData, setPassengerData] = React.useState(null);
            const [seatData, setSeatData] = React.useState(null);
            const [paymentData, setPaymentData] = React.useState(null);
            const [bookingComplete, setBookingComplete] = React.useState(false);
            const [filter, setFilter] = React.useState('all');

            const addToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            };

            React.useEffect(() => {
                window.addToast = addToast;
                return () => {
                    window.addToast = null;
                };
            }, []);

            const removeToast = (id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            };

            const handleLogin = (userData) => {
                setUser(userData);
                setCurrentView('home');
            };

            const handleRegister = (userData) => {
                setUser(userData);
                setCurrentView('home');
            };

            const handleLogout = () => {
                setUser(null);
                setCurrentView('auth');
                setAuthMode('login');
                addToast('Logout realizado com sucesso!', 'info');
            };

            const handleToggleFavorite = (destination) => {
                const isFavorite = favorites.some(f => f.id === destination.id);
                if (isFavorite) {
                    setFavorites(prev => prev.filter(f => f.id !== destination.id));
                    addToast(`Removido dos favoritos: ${destination.name}`, 'info');
                } else {
                    setFavorites(prev => [...prev, destination]);
                    addToast(`Adicionado aos favoritos: ${destination.name}`, 'success');
                }
            };

            const handleSelectDestination = (destination) => {
                setSelectedDestination(destination);
                setCurrentView('flights');
                setCurrentStep(1);
                addToast(`Destino selecionado: ${destination.name}`, 'info');
            };

            const handleSelectFlight = (flight) => {
                setSelectedFlight(flight);
                setCurrentView('passenger');
                setCurrentStep(2);
                addToast(`Voo selecionado! Partida: ${flight.departure}`, 'success');
            };

            const handlePassengerDataSubmit = (data) => {
                setPassengerData(data);
                setCurrentView('seats');
                setCurrentStep(3);
                addToast('Dados do passageiro salvos!', 'success');
            };

            const handleSeatSelectionSubmit = (data) => {
                setSeatData(data);
                setCurrentView('payment');
                setCurrentStep(4);
                addToast('Assentos selecionados!', 'success');
            };

            const handlePaymentSubmit = (data) => {
                setPaymentData(data);
                setCurrentView('confirmation');
                setCurrentStep(5);
                addToast('Pagamento processado!', 'success');
            };

            const handleBookingComplete = () => {
                setBookingComplete(true);
                addToast('Reserva finalizada com sucesso!', 'success');
            };

            const handleBack = () => {
                if (currentView === 'passenger') {
                    setCurrentView('flights');
                    setCurrentStep(1);
                } else if (currentView === 'seats') {
                    setCurrentView('passenger');
                    setCurrentStep(2);
                } else if (currentView === 'payment') {
                    setCurrentView('seats');
                    setCurrentStep(3);
                } else if (currentView === 'flights') {
                    setCurrentView('home');
                    setCurrentStep(1);
                } else if (currentView === 'auth') {
                    setCurrentView('home');
                }
            };

            const handleStartBooking = () => {
                setCurrentView('home');
            };

            // Filtrar voos
            const filteredFlights = selectedDestination 
                ? flightsData.filter(flight => flight.destinationId === selectedDestination.id)
                : [];

            // Progress steps
            const progressSteps = [
                { id: 1, label: 'Escolher Voo' },
                { id: 2, label: 'Dados do Passageiro' },
                { id: 3, label: 'Selecionar Assentos' },
                { id: 4, label: 'Pagamento' },
                { id: 5, label: 'Confirmação' }
            ];

            // Renderizar view atual
            const renderView = () => {
                switch(currentView) {
                    case 'auth':
                        return authMode === 'login' ? (
                            <Login 
                                onLogin={handleLogin}
                                onSwitchToRegister={() => setAuthMode('register')}
                            />
                        ) : (
                            <Register 
                                onRegister={handleRegister}
                                onSwitchToLogin={() => setAuthMode('login')}
                            />
                        );
                    
                    case 'home':
                        return (
                            <div className="app">
                                <div className="header">
                                    <div className="logo">
                                        <div className="logo-icon">
                                            <i className="fas fa-plane" aria-hidden="true"></i>
                                        </div>
                                        <span className="logo-text">TravelReserve Pro</span>
                                    </div>
                                    
                                    <div className="user-menu">
                                        {user ? (
                                            <>
                                                <div className="user-avatar">
                                                    {user.initials}
                                                </div>
                                                <div>
                                                    <div style={{ color: 'var(--gray-700)', fontWeight: '600' }}>{user.name}</div>
                                                    <div style={{ color: 'var(--gray-500)', fontSize: '0.75rem' }}>{user.email}</div>
                                                </div>
                                                <button className="btn btn-outline" onClick={handleLogout}>
                                                    <i className="fas fa-sign-out-alt" aria-hidden="true"></i>
                                                    Sair
                                                </button>
                                            </>
                                        ) : (
                                            <button className="btn btn-primary" onClick={() => setCurrentView('auth')}>
                                                <i className="fas fa-user" aria-hidden="true"></i>
                                                Entrar
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="hero">
                                    <h1 className="hero-title">
                                        Descubra o Mundo Conosco
                                    </h1>
                                    <p className="hero-subtitle">
                                        Reserve voos, escolha seus assentos e pague de forma segura. 
                                        Tudo em um só lugar!
                                    </p>
                                </div>
                                
                                <div className="section-header">
                                    <h2 style={{ margin: 0 }}>Destinos Populares</h2>
                                    <div className="view-all" onClick={() => addToast('Em desenvolvimento!', 'info')}>
                                        Ver todos
                                        <i className="fas fa-arrow-right" aria-hidden="true"></i>
                                    </div>
                                </div>
                                
                                <div className="card-grid">
                                    {destinationsData.map(destination => (
                                        <DestinationCard
                                            key={destination.id}
                                            destination={destination}
                                            onSelect={handleSelectDestination}
                                            onFavorite={handleToggleFavorite}
                                            isFavorite={favorites.some(f => f.id === destination.id)}
                                        />
                                    ))}
                                </div>
                            </div>
                        );
                    
                    case 'flights':
                        return (
                            <div className="app">
                                <button className="btn btn-back" onClick={handleBack}>
                                    <i className="fas fa-arrow-left" aria-hidden="true"></i>
                                    Voltar para Destinos
                                </button>
                                
                                <ProgressBar steps={progressSteps} currentStep={currentStep} />
                                
                                <div className="section-header">
                                    <div>
                                        <h1 style={{ fontSize: '2rem', fontWeight: '700', color: 'white', margin: 0 }}>
                                            Voos para {selectedDestination.name}
                                        </h1>
                                        <div style={{ fontSize: '1rem', opacity: '0.8', marginTop: '0.25rem' }}>
                                            {selectedDestination.country} • {filteredFlights.length} voos disponíveis
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Filtros */}
                                <div className="filter-bar">
                                    <div className="filter-group">
                                        <span className="filter-label">Ordenar por:</span>
                                        <select className="filter-select" onChange={(e) => setFilter(e.target.value)}>
                                            <option value="price">Menor Preço</option>
                                            <option value="duration">Menor Duração</option>
                                            <option value="departure">Horário de Partida</option>
                                            <option value="arrival">Horário de Chegada</option>
                                        </select>
                                    </div>
                                    
                                    <div className="filter-group">
                                        <span className="filter-label">Companhia Aérea:</span>
                                        <select className="filter-select">
                                            <option value="all">Todas</option>
                                            <option value="emirates">Emirates</option>
                                            <option value="qatar">Qatar Airways</option>
                                            <option value="latam">LATAM</option>
                                            <option value="airfrance">Air France</option>
                                        </select>
                                    </div>
                                    
                                    <div className="filter-group">
                                        <span className="filter-label">Paradas:</span>
                                        <select className="filter-select">
                                            <option value="all">Qualquer</option>
                                            <option value="direct">Voo Direto</option>
                                            <option value="1stop">1 Parada</option>
                                        </select>
                                    </div>
                                </div>
                                
                                {/* Aviões disponíveis */}
                                <AvailableAircrafts flights={filteredFlights} />
                                
                                {/* Horários */}
                                <FlightTimes flights={filteredFlights} onSelectTime={(time) => addToast(`Filtrando por ${time}`, 'info')} />
                                
                                {/* Lista de voos */}
                                <div style={{ marginTop: '2rem' }}>
                                    <h2 style={{ fontSize: '1.5rem', fontWeight: '600', color: 'white', marginBottom: '1rem' }}>
                                        Todos os Voos Disponíveis
                                    </h2>
                                    
                                    {filteredFlights.length === 0 ? (
                                        <div className="empty-state">
                                            <div className="empty-state-icon">
                                                <i className="fas fa-plane-slash" aria-hidden="true"></i>
                                            </div>
                                            <h3 style={{ marginBottom: '0.5rem', color: 'var(--gray-700)' }}>
                                                Nenhum voo encontrado
                                            </h3>
                                            <p style={{ color: 'var(--gray-600)' }}>
                                                Não encontramos voos para este destino nas datas selecionadas.
                                            </p>
                                        </div>
                                    ) : (
                                        filteredFlights.map(flight => (
                                            <FlightCard
                                                key={flight.id}
                                                flight={flight}
                                                onSelect={handleSelectFlight}
                                            />
                                        ))
                                    )}
                                </div>
                            </div>
                        );
                    
                    case 'passenger':
                        return (
                            <div className="app">
                                <button className="btn btn-back" onClick={handleBack}>
                                    <i className="fas fa-arrow-left" aria-hidden="true"></i>
                                    Voltar para Voos
                                </button>
                                
                                <ProgressBar steps={progressSteps} currentStep={currentStep} />
                                
                                <PassengerData
                                    onNext={handlePassengerDataSubmit}
                                    onBack={handleBack}
                                    flight={selectedFlight}
                                />
                            </div>
                        );
                    
                    case 'seats':
                        return (
                            <div className="app">
                                <button className="btn btn-back" onClick={handleBack}>
                                    <i className="fas fa-arrow-left" aria-hidden="true"></i>
                                    Voltar
                                </button>
                                
                                <ProgressBar steps={progressSteps} currentStep={currentStep} />
                                
                                <SeatSelection
                                    onNext={handleSeatSelectionSubmit}
                                    onBack={handleBack}
                                    flight={selectedFlight}
                                />
                            </div>
                        );
                    
                    case 'payment':
                        return (
                            <div className="app">
                                <button className="btn btn-back" onClick={handleBack}>
                                    <i className="fas fa-arrow-left" aria-hidden="true"></i>
                                    Voltar
                                </button>
                                
                                <ProgressBar steps={progressSteps} currentStep={currentStep} />
                                
                                <Payment
                                    onComplete={handlePaymentSubmit}
                                    onBack={handleBack}
                                    flight={selectedFlight}
                                    passengerData={passengerData}
                                    seatData={seatData}
                                />
                            </div>
                        );
                    
                    case 'confirmation':
                        return (
                            <div className="app">
                                <ProgressBar steps={progressSteps} currentStep={currentStep} />
                                
                                <Confirmation
                                    bookingData={{
                                        flight: selectedFlight,
                                        passengerData,
                                        seatData,
                                        paymentData
                                    }}
                                    onComplete={() => {
                                        setTimeout(() => {
                                            setCurrentView('home');
                                            setCurrentStep(1);
                                            setSelectedDestination(null);
                                            setSelectedFlight(null);
                                            setPassengerData(null);
                                            setSeatData(null);
                                            setPaymentData(null);
                                        }, 5000);
                                    }}
                                />
                            </div>
                        );
                    
                    default:
                        return null;
                }
            };

            return (
                <div>
                    {renderView()}
                    
                    {/* Toast Notifications */}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <Toast
                                key={toast.id}
                                message={toast.message}
                                type={toast.type}
                                onClose={() => removeToast(toast.id)}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        // Renderizar a aplicação
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
