<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteFit Academy | Transformação Física Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #FF3E41;
            --primary-dark: #D32A2D;
            --primary-light: #FF6B6E;
            --secondary: #1A1D28;
            --secondary-light: #2A2D3A;
            --accent: #00D4FF;
            --accent-dark: #00A8CC;
            --light: #F8F9FA;
            --dark: #12141C;
            --gray: #8C8E9B;
            --light-gray: #E9ECEF;
            --success: #2ED573;
            --warning: #FF9F1A;
            --gradient: linear-gradient(135deg, var(--primary) 0%, #FF6B6E 100%);
            --gradient-dark: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, #00E6FF 100%);
            --gradient-gold: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            --shadow-hover: 0 25px 60px rgba(0, 0, 0, 0.18);
            --shadow-light: 0 5px 20px rgba(0, 0, 0, 0.08);
            --transition-slow: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-fast: all 0.2s ease;
            --border-radius: 16px;
            --border-radius-sm: 10px;
            --border-radius-lg: 24px;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
            font-weight: 400;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .section-spacing {
            padding: 120px 0;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shine {
            from { transform: translateX(-100%) rotate(45deg); }
            to { transform: translateX(100%) rotate(45deg); }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        .animate-on-scroll.animated {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 42px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            z-index: 1;
            gap: 10px;
            font-family: 'Oswald', sans-serif;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: -1;
        }
        
        .btn:hover::before {
            transform: translateX(100%);
        }
        
        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 62, 65, 0.3);
        }
        
        .btn-primary:hover {
            background: var(--gradient-dark);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 62, 65, 0.4);
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-secondary:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-5px);
        }
        
        .btn-accent {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }
        
        .btn-accent:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.4);
        }
        
        .btn-large {
            padding: 22px 50px;
            font-size: 18px;
        }
        
        .btn-small {
            padding: 12px 28px;
            font-size: 14px;
        }
        
        /* Section Title */
        .section-title {
            text-align: center;
            margin-bottom: 80px;
        }
        
        .section-title .subtitle {
            display: block;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .section-title h2 {
            font-size: 3.5rem;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
            color: var(--secondary);
        }
        
        .section-title h2::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 6px;
            background: var(--gradient);
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }
        
        .section-title p {
            color: var(--gray);
            max-width: 750px;
            margin: 40px auto 0;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        
        .highlight {
            color: var(--primary);
            position: relative;
        }
        
        .highlight::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: var(--gradient);
            bottom: 5px;
            left: 0;
            opacity: 0.3;
            z-index: -1;
            border-radius: 4px;
        }
        
        /* Header */
        header {
            background-color: rgba(26, 29, 40, 0.98);
            padding: 25px 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            transition: var(--transition);
            backdrop-filter: blur(15px);
        }
        
        header.scrolled {
            padding: 18px 0;
            background-color: rgba(18, 20, 28, 0.98);
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 2.4rem;
            font-weight: 900;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-icon {
            margin-right: 15px;
            font-size: 2.8rem;
            color: var(--primary);
            animation: pulse 2s infinite;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-left: 45px;
            position: relative;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            position: relative;
            padding: 8px 0;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            background: var(--gradient);
            bottom: 0;
            left: 0;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 3px;
        }
        
        .nav-links a:hover {
            color: var(--primary-light);
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-cta {
            margin-left: 60px;
        }
        
        .mobile-menu-btn {
            display: none;
            background: var(--gradient);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(255, 62, 65, 0.3);
        }
        
        .mobile-menu-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 62, 65, 0.4);
        }
        
        /* Hero */
        .hero {
            background: linear-gradient(rgba(18, 20, 28, 0.92), rgba(18, 20, 28, 0.95)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            padding: 240px 0 180px;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ff3e41' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1.2s ease;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 5rem;
            margin-bottom: 30px;
            line-height: 1.1;
            text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .hero p {
            font-size: 1.4rem;
            max-width: 850px;
            margin: 0 auto 50px;
            color: var(--light-gray);
            opacity: 0.9;
            font-weight: 300;
        }
        
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 50px;
        }
        
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 120px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            position: relative;
        }
        
        .stat-item::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--gradient);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.1;
            z-index: -1;
        }
        
        .stat-number {
            font-size: 4rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            display: block;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 1.2rem;
            color: var(--light-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        /* About */
        .about {
            background-color: white;
            position: relative;
            overflow: hidden;
        }
        
        .about-content {
            display: flex;
            align-items: center;
            gap: 100px;
        }
        
        .about-img {
            flex: 1;
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transform: perspective(1000px) rotateY(-10deg);
            transition: var(--transition-slow);
            position: relative;
        }
        
        .about-img:hover {
            transform: perspective(1000px) rotateY(0deg);
            box-shadow: var(--shadow-hover);
        }
        
        .about-img::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient);
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
            mix-blend-mode: multiply;
        }
        
        .about-img:hover::before {
            opacity: 0.1;
        }
        
        .about-img img {
            width: 100%;
            height: auto;
            display: block;
            transition: var(--transition-slow);
        }
        
        .about-img:hover img {
            transform: scale(1.05);
        }
        
        .about-text {
            flex: 1;
        }
        
        .about-text h3 {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 30px;
        }
        
        .about-text p {
            margin-bottom: 30px;
            color: var(--gray);
            font-size: 1.15rem;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 50px;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 30px;
            background-color: white;
            border-radius: var(--border-radius);
            transition: var(--transition);
            box-shadow: var(--shadow-light);
            border: 1px solid var(--light-gray);
            position: relative;
            overflow: hidden;
        }
        
        .feature::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 0;
            background: var(--gradient);
            transition: height 0.6s ease;
        }
        
        .feature:hover::after {
            height: 100%;
        }
        
        .feature:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow);
        }
        
        .feature-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            flex-shrink: 0;
            transition: var(--transition);
        }
        
        .feature:hover .feature-icon {
            transform: scale(1.1) rotate(5deg);
        }
        
        .feature-text h4 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--secondary);
        }
        
        /* Services */
        .services {
            background-color: var(--light);
            position: relative;
        }
        
        .services::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ff3e41' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 50px;
        }
        
        .service-card {
            background-color: white;
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }
        
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient);
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
        }
        
        .service-card:hover::before {
            opacity: 0.05;
        }
        
        .service-card:hover {
            transform: translateY(-20px);
            box-shadow: var(--shadow-hover);
        }
        
        .service-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(255, 62, 65, 0.3);
        }
        
        .service-img {
            height: 280px;
            overflow: hidden;
            position: relative;
        }
        
        .service-img::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, white, transparent);
            z-index: 1;
        }
        
        .service-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-slow);
        }
        
        .service-card:hover .service-img img {
            transform: scale(1.1);
        }
        
        .service-info {
            padding: 40px;
            position: relative;
            z-index: 2;
        }
        
        .service-info h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--secondary);
        }
        
        .service-info p {
            margin-bottom: 30px;
            color: var(--gray);
            line-height: 1.8;
        }
        
        .service-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Oswald', sans-serif;
        }
        
        .service-link:hover {
            gap: 15px;
            color: var(--primary-dark);
        }
        
        /* Pricing */
        .pricing {
            background-color: white;
            position: relative;
        }
        
        .pricing-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 60px;
            background: var(--light);
            padding: 10px;
            border-radius: 50px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border-radius: 40px;
            flex: 1;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }
        
        .tab-btn.active {
            color: white;
            background: var(--gradient);
            box-shadow: 0 5px 20px rgba(255, 62, 65, 0.3);
        }
        
        .pricing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }
        
        .pricing-card {
            background-color: white;
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            padding: 60px 50px;
            text-align: center;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
        }
        
        .pricing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--gradient);
            opacity: 0;

            useEffect(() => {
                const handleScroll = () => {
                    setShowScrollTop(window.scrollY > 500);
                    setHeaderScrolled(window.scrollY > 100);
                    
                    // Animar elementos ao aparecer na tela
                    const elements = document.querySelectorAll('.animate-on-scroll');
                    elements.forEach(element => {
                        const elementTop = element.getBoundingClientRect().top;
                        const elementVisible = 150;
                        
                        if (elementTop < window.innerHeight - elementVisible) {
                            element.classList.add('animated');
                        }
                    });
                };
                
                window.addEventListener('scroll', handleScroll);
                handleScroll(); // Chamar uma vez para elementos já visíveis
                
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            // Auto-rotacionar depoimentos
            useEffect(() => {
                const interval = setInterval(() => {

                return () => clearInterval(interval);

                if (!loading) {
                    const addFloatingElements = () => {

                        for (let i = 0; i < 8; i++) {

            };
            
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData({
                    ...formData,
                    [name]: value
                });
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                // Simular envio
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    alert(`Obrigado, ${formData.name}! Sua mensagem foi enviada com sucesso. Nossa equipe entrará em contato em até 24h.`);
                    setFormData({
                        name: '',
                        email: '',
                        phone: '',
                        subject: 'Consulta',
                        message: ''
                    });
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }, 1500);
            };
            
            const handleNewsletterSubmit = (e) => {
                e.preventDefault();
                if (newsletterEmail) {
                    const btn = e.target.querySelector('button');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    
                    setTimeout(() => {
                        alert(`Obrigado por se inscrever! Um e-mail de confirmação foi enviado para ${newsletterEmail}`);
                        setNewsletterEmail('');
                        btn.innerHTML = originalText;
                    }, 1000);
                }
            };
            
            const scrollToSection = (sectionId) => {
                const element = document.getElementById(sectionId);
                if (element) {
                    window.scrollTo({
                        top: element.offsetTop - 100,
                        behavior: 'smooth'
                    });
                    setMobileMenuOpen(false);
                }
            };
            
            const scrollToTop = () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            };
            
            // Renderizar Loading
            if (loading) {
                return (
                    <div className="loading-overlay">
                        <div className="loader"></div>
                    </div>
                );
            }
            
            return (
                <div className="App">
                    {/* Header */}
                    <header className={headerScrolled ? 'scrolled' : ''}>
                        <div className="container">
                            <nav className="navbar">
                                <a href="#" className="logo" onClick={(e) => { e.preventDefault(); scrollToSection('home'); }}>
                                    <i className="fas fa-dumbbell logo-icon"></i>
                                    Elite<span>Fit</span> Academy
                                </a>
                                
                                <ul className={`nav-links ${mobileMenuOpen ? 'active' : ''}`}>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('home'); }}>Início</a></li>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('about'); }}>Sobre</a></li>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('services'); }}>Serviços</a></li>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('pricing'); }}>Planos</a></li>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('testimonials'); }}>Depoimentos</a></li>
                                    <li><a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('contact'); }}>Contato</a></li>
                                    <li className="nav-cta"><a href="#" className="btn btn-primary btn-small" onClick={(e) => { e.preventDefault(); scrollToSection('pricing'); }}>Matricule-se</a></li>
                                </ul>
                                
                                <button className="mobile-menu-btn" onClick={toggleMobileMenu}>
                                    <i className={mobileMenuOpen ? "fas fa-times" : "fas fa-bars"}></i>
                                </button>
                            </nav>
                        </div>
                    </header>
                    
                    {/* Hero Section */}
                    <section className="hero" id="home">
                        <div className="container">
                            <div className="hero-content animate-on-scroll">
                                <h1>TRANSFORME SEU <span className="highlight">CORPO</span>,<br />MUDE SUA <span className="highlight">VIDA</span></h1>
                                <p>Na EliteFit Academy, não oferecemos apenas uma academia. Oferecemos uma experiência completa de transformação física e mental com tecnologia de ponta, metodologia científica e uma comunidade que inspira resultados extraordinários.</p>
                                
                                <div className="hero-buttons">
                                    <a href="#" className="btn btn-primary btn-large" onClick={(e) => { e.preventDefault(); scrollToSection('pricing'); }}>
                                        <i className="fas fa-bolt"></i> Comece Sua Jornada
                                    </a>
                                    <a href="#" className="btn btn-secondary btn-large" onClick={(e) => { e.preventDefault(); scrollToSection('about'); }}>
                                        <i className="fas fa-play-circle"></i> Conheça Nossa Academia
                                    </a>
                                </div>
                                
                                <div className="hero-stats">
                                    <div className="stat-item animate-on-scroll">
                                        <span className="stat-number">2.5k+</span>
                                        <span className="stat-label">Alunos Transformados</span>
                                    </div>
                                    <div className="stat-item animate-on-scroll">
                                        <span className="stat-number">35+</span>
                                        <span className="stat-label">Treinadores Especializados</span>
                                    </div>
                                    <div className="stat-item animate-on-scroll">
                                        <span className="stat-number">80+</span>
                                        <span className="stat-label">Aulas Semanais</span>
                                    </div>
                                    <div className="stat-item animate-on-scroll">
                                        <span className="stat-number">12+</span>
                                        <span className="stat-label">Anos de Excelência</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* About Section */}
                    <section className="about section-spacing" id="about">
                        <div className="container">
                            <div className="section-title animate-on-scroll">
                                <span className="subtitle">Por que somos diferentes</span>
                                <h2>A Excelência em <span className="highlight">Cada Detalhe</span></h2>
                                <p>Combinamos ciência do exercício, tecnologia de ponta e um ambiente inspirador para criar a experiência fitness mais avançada do mercado.</p>
                            </div>
                            
                            <div className="about-content">
                                <div className="about-img animate-on-scroll">
                                    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" alt="EliteFit Academy" />
                                </div>
                                
                                <div className="about-text animate-on-scroll">
                                    <h3>Experiência de <span className="highlight">Transformação Total</span></h3>
                                    <p>Com mais de uma década de excelência no mercado fitness, desenvolvemos uma metodologia única que integra treinamento de alto desempenho, nutrição cientificamente embasada e acompanhamento psicofísico personalizado.</p>
                                    <p>Nossa missão transcende o físico - buscamos empoderar cada indivíduo para alcançar seu potencial máximo, cultivando resiliência, disciplina e bem-estar integral que se refletem em todas as áreas da vida.</p>
                                    
                                    <div className="features">
                                        <div className="feature animate-on-scroll">
                                            <div className="feature-icon">
                                                <i className="fas fa-microchip"></i>
                                            </div>
                                            <div className="feature-text">
                                                <h4>Tecnologia de Ponta</h4>
                                                <p>Equipamentos com IA que se adaptam ao seu desempenho e monitoram sua evolução em tempo real.</p>
                                            </div>
                                        </div>
                                        
                                        <div className="feature animate-on-scroll">
                                            <div className="feature-icon">
                                                <i className="fas fa-graduation-cap"></i>
                                            </div>
                                            <div className="feature-text">
                                                <h4>Treinadores com Mestrado</h4>
                                                <p>Profissionais com certificações internacionais e formação contínua em fisiologia do exercício.</p>
                                            </div>
                                        </div>
                                        
                                        <div className="feature animate-on-scroll">
                                            <div className="feature-icon">
                                                <i className="fas fa-heart-pulse"></i>
                                            </div>
                                            <div className="feature-text">
                                                <h4>Monitoramento Biométrico</h4>
                                                <p>Acompanhamento com wearables avançados e avaliações periódicas de composição corporal.</p>

                                        </div>
                                        
                                        <div className="feature animate-on-scroll">

                                                <i className="fas fa-handshake"></i>
                                            </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* Services Section */}
                    <section className="services section-spacing" id="services">
                        <div className="container">
                            <div className="section-title animate-on-scroll">
                                <span className="subtitle">O que oferecemos</span>
                                <h2>Serviços <span className="highlight">Premium</span></h2>
                                <p>Da musculação inteligente à recuperação avançada, oferecemos uma gama completa de serviços para atender desde iniciantes até atletas de elite.</p>
                            </div>
                            
                            <div className="services-grid">
                                <div className="service-card animate-on-scroll">
                                    <div className="service-badge">Tecnologia IA</div>
                                    <div className="service-img">
                                        <img src="https://images.unsplash.com/photo-1534367507877-0edd93bd013b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" alt="Musculação Inteligente" />
                                    </div>
                                    <div className="service-info">
                                        <h3>Musculação com IA</h3>
                                        <p>Sistemas de treino adaptativo que analisam sua biomecânica em tempo real, ajustam cargas automaticamente e previnem lesões enquanto maximizam resultados.</p>

                                            Saiba mais <i className="fas fa-arrow-right-long"></i>
                                        </a>
                                    </div>
                                </div>
                                
                                <div className="service-card animate-on-scroll">
                                    <div className="service-badge">Personalizado</div>
                                    <div className="service-img">
                                        <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" alt="Personal Trainer Elite" />
                                    </div>
                                    <div className="service-info">
                                        <h3>Personal Trainer Elite</h3>
                                        <p>Acompanhamento 1:1 com especialistas em diferentes áreas: emagrecimento, hipertrofia, reabilitação, preparação física e otimização de performance atlética.</p>
                                        <a href="#" className="service-link" onClick={(e) => { e.preventDefault(); scrollToSection('contact'); }}>
                                            Saiba mais <i className="fas fa-arrow-right-long"></i>
                                        </a>
                                    </div>
                                </div>
                                
                                <div className="service-card animate-on-scroll">
                                    <div className="service-badge">Experiência Imersiva</div>
                                    <div className="service-img">
                                        <img src="https://images.unsplash.com/photo-1574680178050-55c6a6a96e0a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1469&q=80" alt="Aulas Coletivas Imersivas" />
                                    </div>
                                    <div className="service-info">
                                        <h3>Aulas Coletivas Imersivas</h3>
                                        <p>Experiência multisensorial com iluminação dinâmica, som 360° e projeções holográficas que transportam você para diferentes ambientes em cada aula.</p>

                                            Saiba mais <i className="fas fa-arrow-right-long"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* Pricing Section */}
                    <section className="pricing section-spacing" id="pricing">
                        <div className="container">
                            <div className="section-title animate-on-scroll">
                                <span className="subtitle">Invista em você</span>
                                <h2>Planos <span className="highlight">Exclusivos</span></h2>
                                <p>Escolha o plano perfeito para sua jornada. Todos incluem avaliação física completa, acesso à comunidade e garantia de resultados em 90 dias.</p>
                            </div>
                            
                            <div className="pricing-tabs animate-on-scroll">
                                <button className={`tab-btn ${activeTab === 'monthly' ? 'active' : ''}`} onClick={() => setActiveTab('monthly')}>
                                    <i className="fas fa-calendar-alt"></i> Mensal
                                </button>
                                <button className={`tab-btn ${activeTab === 'annual' ? 'active' : ''}`} onClick={() => setActiveTab('annual')}>
                                    <i className="fas fa-calendar-star"></i> Anual (Economize 20%)
                                </button>
                            </div>
                            
                            <div className="pricing-cards">
                                {plans[activeTab].map((plan, index) => (
                                    <div className={`pricing-card animate-on-scroll ${plan.featured ? 'featured' : ''}`} key={index} style={{ animationDelay: `${index * 0.1}s` }}>
                                        {plan.featured && <div className="featured-badge">Mais Popular</div>}
                                        <h3 className="plan-name">{plan.name}</h3>
                                        <div className="plan-price">
                                            R$ {plan.price}<span>/mês</span>
                                        </div>
                                        <ul className="plan-features">
                                            {plan.features.map((feature, idx) => (
                                                <li key={idx}><i className="fas fa-check-circle"></i> {feature}</li>
                                            ))}
                                        </ul>
                                        <a href="#" className="btn btn-primary" onClick={(e) => { e.preventDefault(); scrollToSection('contact'); }}>
                                            <i className="fas fa-rocket"></i> Escolher Plano
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                    
                    {/* Testimonials Section */}
                    <section className="testimonials section-spacing" id="testimonials">
                        <div className="container">
                            <div className="section-title animate-on-scroll">
                                <span className="subtitle">Histórias reais</span>
                                <h2>Transformações <span className="highlight">Incríveis</span></h2>
                                <p>Veja o que nossos alunos têm a dizer sobre suas jornadas de transformação na EliteFit Academy.</p>
                            </div>
                            
                            <div className="testimonial-slider">
                                <div className="testimonial-slide animate-on-scroll">
                                    <div className="testimonial-text">
                                        "{testimonials[currentTestimonial].text}"
                                    </div>
                                    <div className="testimonial-author">
                                        <div className="author-img">
                                            <img src={testimonials[currentTestimonial].img} alt={testimonials[currentTestimonial].name} />
                                        </div>
                                        <div className="author-info">
                                            <h4>{testimonials[currentTestimonial].name}</h4>
                                            <p>{testimonials[currentTestimonial].role}</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="slider-dots">
                                    {testimonials.map((_, index) => (
                                        <div 
                                            key={index} 
                                            className={`dot ${index === currentTestimonial ? 'active' : ''}`}
                                            onClick={() => setCurrentTestimonial(index)}
                                        ></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                                <div className="contact-info animate-on-scroll">

                                            </div>
                                            <div className="contact-text">
                                                <h4>Endereço Premium</h4>
                                                <p>Av. Faria Lima, 4500 - Jardim Europa<br />São Paulo - SP | CEP: 01451-000</p>
                                            </div>
                                        </div>

                                            </div>
                                        </div>
                                        
                                        <div className="contact-detail">

                                            <div className="contact-text">

                                    <div className="social-links">

                                                type="text" 
                                                id="name" 
                                                name="name" 
                                                className="form-control" 
                                                value={formData.name}

                                                placeholder="Digite seu nome completo"

                                                type="tel"

                                                placeholder="(11) 99999-9999"

                                            <label htmlFor="subject"><i className="fas fa-bullseye"></i> Assunto</label>

                                    <i className="fab fa-cc-visa" title="Visa"></i>
                                    <i className="fab fa-cc-mastercard" title="Mastercard"></i>
                                    <i className="fab fa-cc-amex" title="American Express"></i>
                                    <i className="fab fa-cc-paypal" title="PayPal"></i>
                                    <i className="fab fa-cc-apple-pay" title="Apple Pay"></i>
                                    <i className="fab fa-cc-amazon-pay" title="Amazon Pay"></i>
                                </div>
                            </div>
                        </div>
                    </footer>
                    
                    {/* Scroll to Top Button */}
                    <div className={`scroll-top ${showScrollTop ? 'active' : ''}`} onClick={scrollToTop}>
                        <i className="fas fa-chevron-up"></i>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
